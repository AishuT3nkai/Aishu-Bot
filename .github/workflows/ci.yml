name: Python CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Database smoke test
        run: python -c "from utils.database import connect; db = connect(); db.execute('SELECT 1'); db.close()"
      - name: Import feature modules
        run: python -c "import cogs.automod, cogs.antiraid, cogs.economy, cogs.community_tools, cogs.server_backup"
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
